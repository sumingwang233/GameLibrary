name: code-review-graph

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: code-review-graph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Code review graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: tirth8205/code-review-graph@fa04ea21e701d9feb748199dbb0b4cf4f365f8f9 # v2.3.9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
