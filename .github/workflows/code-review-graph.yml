name: code-review-graph

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Code review graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: tirth8205/code-review-graph@v2.3.9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
