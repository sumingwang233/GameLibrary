name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: .NET 格式
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.401"
      - run: dotnet format --verify-no-changes

  dotnet:
    name: .NET 门禁（Release 构建 / 全量测试）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          # global.json 锁定 10.0.401 且 rollForward=disable，必须精确安装。
          dotnet-version: "10.0.401"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: operation generation check
        run: python scripts/generate_operations.py --check

      - name: localization check
        run: python scripts/check_localization.py

      - name: README and release policy check
        run: python scripts/check_release.py --self-test

      - name: Release 构建
        run: dotnet build -c Release --nologo

      # 测试夹具固定落盘 D:\Official\GameLibrary\artifacts\test-runs（绝对路径），
      # windows-latest 的 D: 盘可写；运行器一次性环境，无需清理。
      # GitHub 自动设置 CI=true：性能测试据此跳过延迟预算断言（运行器性能不稳），
      # 计数与正确性断言全部保留。
      - name: 全量测试
        run: dotnet test -c Release --no-build --nologo --logger trx --results-directory artifacts/test-results

      - name: 测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore

  frontend:
    name: 前端与 Rust（typecheck / vite build / cargo）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          # prepare:sidecars 需要 .NET 发布 TauriBridge/Host sidecar，
          # cargo check 的 build.rs 校验 externalBin 存在。
          dotnet-version: "10.0.401"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/GameLibrary.Tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/GameLibrary.Tauri/src-tauri

      - name: npm ci
        run: npm ci
        working-directory: src/GameLibrary.Tauri

      - name: frontend tests
        run: npm test
        working-directory: src/GameLibrary.Tauri

      - name: typecheck
        run: npm run typecheck
        working-directory: src/GameLibrary.Tauri

      - name: vite build
        run: npm run build
        working-directory: src/GameLibrary.Tauri

      - name: prepare sidecars
        run: npm run prepare:sidecars
        working-directory: src/GameLibrary.Tauri

      - name: cargo fmt
        run: cargo fmt --check
        working-directory: src/GameLibrary.Tauri/src-tauri

      - name: cargo check
        run: cargo check
        working-directory: src/GameLibrary.Tauri/src-tauri
