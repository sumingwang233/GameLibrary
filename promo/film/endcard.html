<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>GameLibrary end card</title>
<style>
  :root {
    --bg-0: #12161d;
    --bg-1: #171a21;
    --bg-2: #0f1218;
    --ink: #f2f6f9;
    --ink-soft: #a9b6c1;
    --ink-faint: #78868f;
    --accent: #66c0f4;
    --accent-strong: #8ed5f7;
    --line: rgba(102, 192, 244, 0.26);
    --panel: rgba(27, 40, 56, 0.82);
    --shelf-line: rgba(102, 192, 244, 0.10);
    --shelf-fill: rgba(36, 52, 71, 0.26);
    --veil: rgba(23, 26, 33, 0.9);
    --glow: rgba(102, 192, 244, 0.16);
  }
  html.light {
    --bg-0: #ffffff;
    --bg-1: #f4f6f9;
    --bg-2: #e9eff5;
    --ink: #16202b;
    --ink-soft: #4b5c6d;
    --ink-faint: #7b8a99;
    --accent: #1a73b8;
    --accent-strong: #155e96;
    --line: rgba(26, 115, 184, 0.24);
    --panel: rgba(255, 255, 255, 0.88);
    --shelf-line: rgba(26, 115, 184, 0.10);
    --shelf-fill: rgba(255, 255, 255, 0.7);
    --veil: rgba(244, 246, 249, 0.86);
    --glow: rgba(26, 115, 184, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg-1); }
  #stage {
    position: relative; width: 1440px; height: 810px; overflow: hidden;
    background:
      radial-gradient(900px 620px at 16% 22%, var(--glow), rgba(0, 0, 0, 0) 64%),
      linear-gradient(165deg, var(--bg-0) 0%, var(--bg-1) 52%, var(--bg-2) 100%);
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink);
  }
  #shelf { position: absolute; right: -120px; top: -40px; width: 760px; height: 890px; opacity: 0.85;
    transform: rotate(-6deg); }
  #shelf .row { display: flex; gap: 18px; margin-bottom: 18px; }
  #shelf .card {
    width: 96px; height: 132px; border-radius: 7px;
    border: 1px solid var(--shelf-line);
    background: var(--shelf-fill);
  }
  #veil {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, var(--veil) 0%, var(--veil) 42%, rgba(0, 0, 0, 0) 78%),
                linear-gradient(0deg, var(--veil) 0%, rgba(0, 0, 0, 0) 34%);
  }
  #content { position: absolute; left: 112px; top: 84px; width: 900px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 56px; height: 56px; border-radius: 14px; display: block;
    box-shadow: 0 12px 34px rgba(26, 115, 184, 0.22); }
  .brand .word { font-size: 34px; font-weight: 700; letter-spacing: 0.4px; color: var(--ink); }
  .brand .word b { color: var(--accent); font-weight: 700; }
  h1 { margin: 42px 0 0; font-size: 96px; line-height: 1.06; font-weight: 700; letter-spacing: 1px; }
  h1 span { display: block; }
  h1 .accent { color: var(--accent); }
  .sub { margin-top: 24px; font-size: 31px; line-height: 1.6; color: var(--ink-soft); letter-spacing: 0.3px; }
  .url {
    margin-top: 32px; display: inline-flex; align-items: center; gap: 14px;
    padding: 18px 30px 18px 26px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--panel);
    font-size: 34px; font-weight: 600; color: var(--accent-strong); letter-spacing: 0.2px;
  }
  .url svg { width: 26px; height: 26px; opacity: 0.85; }
  .meta { margin-top: 26px; display: flex; align-items: center; gap: 16px; font-size: 21px; color: var(--ink-faint); }
  .chip {
    padding: 7px 15px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--accent); font-size: 20px; letter-spacing: 0.3px;
  }
  .foot { position: absolute; left: 112px; bottom: 56px; font-size: 19px; line-height: 1.7; color: var(--ink-faint); }
  .foot b { color: var(--ink-soft); font-weight: 600; }
</style>
</head>
<body>
  <div id="stage">
    <div id="shelf" aria-hidden="true"></div>
    <div id="veil" aria-hidden="true"></div>
    <div id="content">
      <div class="brand">
        <img src="assets/app-icon.png" alt="" />
        <div class="word">Game<b>Library</b></div>
      </div>
      <h1><span>把散落的游戏</span><span class="accent">整理到一处</span></h1>
      <div class="sub">把准备工作交给工具，把时间留给游戏。</div>
      <div class="url">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.2 1.2"></path>
          <path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.2-1.2"></path>
        </svg>
        https://github.com/sumingwang233/GameLibrary
      </div>
      <div class="meta">
        <span class="chip">v1.7.22 · 开发版演示</span>
        <span>可下载功能以发布版本为准</span>
      </div>
    </div>
    <div class="foot">MIT License · Windows 本地游戏库<br /><b>配乐</b> Pamgaea · Kevin MacLeod · CC BY 4.0</div>
  </div>
  <script>
    if (new URLSearchParams(location.search).get("theme") === "light") {
      document.documentElement.classList.add("light");
    }
    const shelf = document.getElementById("shelf");
    for (let row = 0; row < 7; row += 1) {
      const el = document.createElement("div");
      el.className = "row";
      el.style.paddingLeft = (row % 2) * 44 + "px";
      el.innerHTML = '<div class="card"></div>'.repeat(7);
      shelf.appendChild(el);
    }
  </script>
</body>
</html>
